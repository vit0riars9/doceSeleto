<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doce Seleto — Confeitaria Artesanal | Cardápio Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#F3567A',
              hover: '#E04267',
              soft: '#FDECEF',
              tint: '#FDF2F4',
              cream: '#FEF9EA',
              creamDark: '#F8F0D8',
              ink: '#261E1E',
              muted: '#6E6262',
              border: '#EFE6D5',
            }
          },
          fontFamily: {
            sans: ['"Poppins"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Poppins', system-ui, sans-serif; }
    body { background-color: #FEF9EA; color: #261E1E; -webkit-font-smoothing: antialiased; margin: 0; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #FEF9EA; }
    ::-webkit-scrollbar-thumb { background: #E2D5BE; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #F3567A; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media print {
      body * { visibility: hidden !important; }
      #thermal-receipt-area, #thermal-receipt-area * { visibility: visible !important; }
      #thermal-receipt-area {
        position: fixed !important; left: 0 !important; top: 0 !important;
        width: 80mm !important; max-width: 80mm !important; margin: 0 !important;
        padding: 4mm !important; background: #ffffff !important; color: #000000 !important;
        box-shadow: none !important; border: none !important; font-size: 11px !important; line-height: 1.35 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-brand-primary/20 selection:text-brand-ink">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <!-- App Root -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Admin PIN Login Modal -->
  <div id="admin-pin-modal" class="fixed inset-0 z-[100] bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-brand-border space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 rounded-full bg-brand-soft text-brand-primary flex items-center justify-center mx-auto mb-2">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h3 class="text-base font-semibold text-brand-ink">Acesso Restrito ao Lojista</h3>
        <p class="text-xs text-brand-muted mt-1">Digite a senha PIN de administração.</p>
      </div>
      <div>
        <input type="password" id="admin-pin-input" maxlength="10" placeholder="Digite sua senha PIN"
          class="w-full text-center tracking-widest text-lg py-3 rounded-xl bg-brand-cream/60 border border-brand-border font-semibold focus:outline-none focus:border-brand-primary"
          onkeydown="if(event.key === 'Enter') submitAdminPin()" />
      </div>
      <div class="flex gap-2.5">
        <button type="button" onclick="closeAdminPinModal()" class="flex-1 py-2.5 rounded-xl border border-brand-border text-brand-muted font-medium text-xs hover:bg-neutral-50 transition cursor-pointer">
          Cancelar
        </button>
        <button type="button" onclick="submitAdminPin()" class="flex-1 py-2.5 rounded-xl bg-brand-primary text-white font-medium text-xs hover:bg-brand-hover transition shadow-sm cursor-pointer">
          Entrar
        </button>
      </div>
    </div>
  </div>

  <!-- Thermal Receipt Print Modal -->
  <div id="print-modal-wrapper" class="fixed inset-0 z-[90] bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden flex flex-col max-h-[90vh] border border-brand-border">
      <div class="px-5 py-4 bg-brand-ink text-white flex items-center justify-between no-print">
        <div class="flex items-center gap-2.5">
          <i data-lucide="printer" class="w-4 h-4 text-brand-primary"></i>
          <span class="font-medium text-sm">Comanda Térmica 80mm</span>
        </div>
        <button type="button" onclick="closePrintModal()" class="text-white/70 hover:text-white p-1 transition cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto bg-neutral-100 flex justify-center">
        <div id="thermal-receipt-area" class="bg-white w-[302px] p-4 shadow-sm border border-dashed border-neutral-300 text-xs text-black leading-snug"></div>
      </div>
      <div class="p-4 bg-white border-t border-neutral-200 flex gap-3 no-print">
        <button type="button" onclick="closePrintModal()" class="flex-1 py-2.5 px-4 rounded-xl border border-neutral-300 text-neutral-700 font-medium text-sm hover:bg-neutral-50 transition cursor-pointer">
          Fechar
        </button>
        <button type="button" onclick="window.print()" class="flex-1 py-2.5 px-4 rounded-xl bg-brand-primary text-white font-medium text-sm hover:bg-brand-hover transition flex items-center justify-center gap-2 shadow-sm cursor-pointer">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>Imprimir</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // --- CREDENCIAIS DO FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyASFaJRGSFvakIoKxQ0E0j_dYwuf5_G53A",
      authDomain: "doce-seleto.firebaseapp.com",
      projectId: "doce-seleto",
      storageBucket: "doce-seleto.firebasestorage.app",
      messagingSenderId: "665554412176",
      appId: "1:665554412176:web:be6ddfcb48b04ac4fae15",
      measurementId: "G-1BWVNCMEC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID = "doce-seleto-prod";

    const DEFAULT_SETTINGS = {
      storeName: "Doce Seleto",
      storeSubtitle: "Confeitaria Artesanal",
      customLogo: null,
      whatsappNumber: "5514999999999",
      deliveryFee: 7.00,
      minOrder: 20.00,
      pixKey: "000.000.000-00",
      pixName: "Doce Seleto Confeitaria",
      adminPin: "1234",
      manualStatus: "auto",
      schedule: [
        { day: 0, name: "Domingo", open: "14:00", close: "20:00", active: true },
        { day: 1, name: "Segunda-feira", open: "09:00", close: "18:00", active: false },
        { day: 2, name: "Terça-feira", open: "09:00", close: "18:00", active: true },
        { day: 3, name: "Quarta-feira", open: "09:00", close: "18:00", active: true },
        { day: 4, name: "Quinta-feira", open: "09:00", close: "18:00", active: true },
        { day: 5, name: "Sexta-feira", open: "09:00", close: "19:00", active: true },
        { day: 6, name: "Sábado", open: "10:00", close: "20:00", active: true }
      ]
    };

    const DEFAULT_CATEGORIES = [
      { id: 'cat-1', name: 'Bolos & Fatias' },
      { id: 'cat-2', name: 'Tortas Artesanais' },
      { id: 'cat-3', name: 'Doces Finos & Potes' },
      { id: 'cat-4', name: 'Brownies & Cookies' },
      { id: 'cat-5', name: 'Bebidas' }
    ];

    const DEFAULT_PRODUCTS = [
      {
        id: 'prod-1',
        name: 'Bolo no Pote Ninho com Nutella',
        categoryId: 'cat-3',
        price: 16.50,
        description: 'Massa fofinha de chocolate 50%, creme suave de Leite Ninho e camadas generosas de Nutella pura.',
        image: 'https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?auto=format&fit=crop&w=800&q=80',
        active: true,
        addons: [
          { id: 'add-1', name: 'Calda Extra de Nutella', price: 4.00 }
        ]
      },
      {
        id: 'prod-2',
        name: 'Caixa 6 Brigadeiros Belga',
        categoryId: 'cat-3',
        price: 24.00,
        description: 'Feitos com chocolate Callebaut ao leite e granulado belga split. Derrete na boca.',
        image: 'https://images.unsplash.com/photo-1541783245831-57d6fb0926d3?auto=format&fit=crop&w=800&q=80',
        active: true,
        addons: []
      },
      {
        id: 'prod-3',
        name: 'Fatia Torta Banoffee Artesanal',
        categoryId: 'cat-2',
        price: 18.00,
        description: 'Base crocante de biscoito, doce de leite cozido na pressão, bananas frescas e chantilly com canela.',
        image: 'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=800&q=80',
        active: true,
        addons: []
      }
    ];

    // --- ESTADO GLOBAL EXPOSTO NO WINDOW ---
    window.state = {
      view: 'storefront',
      adminTab: 'orders',
      selectedCategory: 'all',
      searchQuery: '',
      cart: [],
      isCartOpen: false,
      cartStep: 'items',
      selectedProductModal: null,
      pixPaymentModal: null,
      newCategoryName: '',
      settings: { ...DEFAULT_SETTINGS },
      categories: [...DEFAULT_CATEGORIES],
      products: [...DEFAULT_PRODUCTS],
      orders: [],
      dbConnected: false,
      lastOrderCount: null,
      checkout: {
        customerName: '',
        customerPhone: '',
        deliveryType: 'delivery',
        street: '',
        number: '',
        neighborhood: '',
        complement: '',
        reference: '',
        paymentMethod: 'pix',
        changeFor: ''
      }
    };

    const state = window.state;
    let pixTimerInterval = null;

    // --- SINCRONIZAÇÃO EM TEMPO REAL COM FIREBASE ---
    async function initCloudSync() {
      try {
        await signInAnonymously(auth);
        onAuthStateChanged(auth, async (user) => {
          if (!user) return;
          state.dbConnected = true;

          // 1. Configurações
          const settingsRef = doc(db, "stores", APP_ID, "config", "settings");
          const settingsSnap = await getDoc(settingsRef);
          if (!settingsSnap.exists()) {
            await setDoc(settingsRef, DEFAULT_SETTINGS);
          }
          onSnapshot(settingsRef, (snap) => {
            if (snap.exists()) {
              state.settings = { ...DEFAULT_SETTINGS, ...snap.data() };
              window.render();
            }
          });

          // 2. Categorias
          const catRef = doc(db, "stores", APP_ID, "config", "categories");
          const catSnap = await getDoc(catRef);
          if (!catSnap.exists()) {
            await setDoc(catRef, { list: DEFAULT_CATEGORIES });
          }
          onSnapshot(catRef, (snap) => {
            if (snap.exists() && Array.isArray(snap.data().list)) {
              state.categories = snap.data().list;
              window.render();
            }
          });

          // 3. Produtos
          const prodCol = collection(db, "stores", APP_ID, "products");
          onSnapshot(prodCol, async (snapshot) => {
            if (snapshot.empty && !localStorage.getItem("ds_seeded")) {
              localStorage.setItem("ds_seeded", "1");
              for (const p of DEFAULT_PRODUCTS) {
                await setDoc(doc(prodCol, p.id), p);
              }
              return;
            }
            state.products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            window.render();
          });

          // 4. Pedidos em Tempo Real
          const ordersCol = collection(db, "stores", APP_ID, "orders");
          onSnapshot(ordersCol, (snapshot) => {
            const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

            if (state.lastOrderCount !== null && list.length > state.lastOrderCount) {
              const newest = list[0];
              triggerNewOrderAlert(newest);
            }
            state.lastOrderCount = list.length;
            state.orders = list;
            window.render();
          });
        });
      } catch (err) {
        console.error("Erro ao conectar ao Firebase:", err);
        window.showToast("Modo offline ativo.", "error");
      }
    }

    // --- FUNÇÕES DE PERSISTÊNCIA NA NUVEM ---
    window.saveSettingsToCloud = async (newSettings) => {
      state.settings = { ...state.settings, ...newSettings };
      window.render();
      try {
        await setDoc(doc(db, "stores", APP_ID, "config", "settings"), state.settings);
        window.showToast("Configurações salvas na nuvem!");
      } catch (e) {
        window.showToast("Erro ao salvar configurações.", "error");
      }
    };

    window.saveCategoriesToCloud = async (newCategories) => {
      state.categories = newCategories;
      window.render();
      try {
        await setDoc(doc(db, "stores", APP_ID, "config", "categories"), { list: newCategories });
      } catch (e) {
        window.showToast("Erro ao atualizar categorias.", "error");
      }
    };

    window.saveProductToCloud = async (product) => {
      try {
        const id = product.id || "prod-" + Date.now();
        await setDoc(doc(db, "stores", APP_ID, "products", id), { ...product, id });
        window.showToast("Produto salvo com sucesso!");
      } catch (e) {
        window.showToast("Erro ao salvar produto.", "error");
      }
    };

    window.deleteProductFromCloud = async (id) => {
      try {
        await deleteDoc(doc(db, "stores", APP_ID, "products", id));
        window.showToast("Produto excluído.");
      } catch (e) {
        window.showToast("Erro ao excluir produto.", "error");
      }
    };

    async function createOrderInCloud(order) {
      try {
        const docRef = await addDoc(collection(db, "stores", APP_ID, "orders"), order);
        return docRef.id;
      } catch (e) {
        return "local-" + Date.now();
      }
    }

    window.updateOrderStatusInCloud = async (orderId, status) => {
      try {
        await updateDoc(doc(db, "stores", APP_ID, "orders", orderId), { status });
        window.showToast("Status atualizado!");
      } catch (e) {
        window.showToast("Erro ao atualizar pedido.", "error");
      }
    };

    window.deleteOrderFromCloud = async (orderId) => {
      try {
        await deleteDoc(doc(db, "stores", APP_ID, "orders", orderId));
        window.showToast("Pedido removido.");
      } catch (e) {
        window.showToast("Erro ao remover pedido.", "error");
      }
    };

    // --- UTILITÁRIOS E NOTIFICAÇÕES ---
    function formatBRL(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    window.showToast = (message, type = 'success') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-emerald-800 text-white',
        error: 'bg-rose-800 text-white',
        info: 'bg-neutral-900 text-white'
      };
      toast.className = `px-4 py-3 rounded-xl shadow-lg text-xs font-medium pointer-events-auto transition transform translate-y-2 opacity-0 flex items-center gap-2 ${bgColors[type] || bgColors.success}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 20);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    };

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    function triggerNewOrderAlert(order) {
      if (!state.adminAuthenticated) return;
      playNotificationSound();
      window.showToast(`Novo pedido de ${order.customerName} (${formatBRL(order.total)})!`);
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`🔔 Novo Pedido #${order.id}!`, {
          body: `${order.customerName} • ${formatBRL(order.total)}`,
        });
      }
    }

    window.requestBrowserNotificationPermission = async () => {
      if (!("Notification" in window)) {
        window.showToast('Seu navegador não suporta notificações.', 'error');
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        window.showToast('Notificações ativadas!', 'success');
        playNotificationSound();
      } else {
        window.showToast('Permissão de notificação negada.', 'error');
      }
    };

    function checkStoreStatus() {
      const manual = state.settings.manualStatus;
      if (manual === 'open') return { isOpen: true, label: 'Aberto agora', reason: 'Controle manual' };
      if (manual === 'closed') return { isOpen: false, label: 'Fechado no momento', reason: 'Controle manual' };

      const now = new Date();
      const currentDay = now.getDay();
      const currentTimeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      const scheduleItem = (state.settings.schedule || []).find(s => s.day === currentDay);
      if (!scheduleItem || !scheduleItem.active) {
        return { isOpen: false, label: 'Fechado no momento', reason: 'Fora do expediente' };
      }

      if (currentTimeStr >= scheduleItem.open && currentTimeStr <= scheduleItem.close) {
        return { isOpen: true, label: 'Aberto agora', reason: `Até às ${scheduleItem.close}` };
      } else {
        return { isOpen: false, label: 'Fechado no momento', reason: `Horário: ${scheduleItem.open} às ${scheduleItem.close}` };
      }
    }

    // --- ADMIN LOGIN PIN ---
    window.promptAdminAccess = () => {
      const modal = document.getElementById('admin-pin-modal');
      const input = document.getElementById('admin-pin-input');
      if (modal && input) {
        input.value = '';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        input.focus();
      }
    };

    window.closeAdminPinModal = () => {
      const modal = document.getElementById('admin-pin-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

    window.submitAdminPin = () => {
      const input = document.getElementById('admin-pin-input');
      if (!input) return;
      const enteredPin = input.value.trim();
      const correctPin = state.settings.adminPin || '1234';

      if (enteredPin === correctPin) {
        window.closeAdminPinModal();
        state.adminAuthenticated = true;
        state.view = 'admin';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        window.showToast('Acesso administrativo autorizado.', 'success');
        window.render();
      } else {
        window.showToast('PIN incorreto.', 'error');
        input.value = '';
        input.focus();
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        window.promptAdminAccess();
      }
    });

    // --- CARRINHO E MODAIS ---
    window.openProductModal = (productId) => {
      const product = state.products.find(p => p.id === productId);
      if (!product || !product.active) return;
      state.selectedProductModal = {
        product,
        quantity: 1,
        selectedAddons: [],
        notes: ''
      };
      window.render();
    };

    window.closeProductModal = () => {
      state.selectedProductModal = null;
      window.render();
    };

    window.toggleModalAddon = (addonId) => {
      const modal = state.selectedProductModal;
      if (!modal) return;
      if (modal.selectedAddons.includes(addonId)) {
        modal.selectedAddons = modal.selectedAddons.filter(id => id !== addonId);
      } else {
        modal.selectedAddons.push(addonId);
      }
      window.render();
    };

    window.updateModalQuantity = (delta) => {
      const modal = state.selectedProductModal;
      if (!modal) return;
      modal.quantity = Math.max(1, modal.quantity + delta);
      window.render();
    };

    window.updateModalNotes = (val) => {
      const modal = state.selectedProductModal;
      if (!modal) return;
      modal.notes = val;
    };

    window.addModalProductToCart = () => {
      const modal = state.selectedProductModal;
      if (!modal) return;

      const chosenAddons = (modal.product.addons || []).filter(a => modal.selectedAddons.includes(a.id));

      const cartItem = {
        cartItemId: 'ci-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
        productId: modal.product.id,
        name: modal.product.name,
        image: modal.product.image,
        unitPrice: modal.product.price,
        quantity: modal.quantity,
        addons: chosenAddons,
        notes: modal.notes.trim()
      };

      state.cart.push(cartItem);
      state.selectedProductModal = null;
      window.showToast(`"${cartItem.name}" adicionado à sacola.`, 'success');
      window.render();
    };

    window.openCart = () => {
      state.isCartOpen = true;
      state.cartStep = 'items';
      window.render();
    };

    window.closeCart = () => {
      state.isCartOpen = false;
      window.render();
    };

    window.updateCartItemQty = (cartItemId, delta) => {
      const item = state.cart.find(i => i.cartItemId === cartItemId);
      if (!item) return;
      const next = item.quantity + delta;
      if (next <= 0) {
        state.cart = state.cart.filter(i => i.cartItemId !== cartItemId);
      } else {
        item.quantity = next;
      }
      window.render();
    };

    window.removeCartItem = (cartItemId) => {
      state.cart = state.cart.filter(i => i.cartItemId !== cartItemId);
      window.showToast('Item removido.', 'info');
      window.render();
    };

    function getCartTotals() {
      const subtotal = state.cart.reduce((acc, item) => {
        const addonsTotal = item.addons.reduce((sum, a) => sum + a.price, 0);
        return acc + (item.unitPrice + addonsTotal) * item.quantity;
      }, 0);

      const deliveryFee =
        state.cart.length > 0 && state.checkout.deliveryType === 'delivery'
          ? Number(state.settings.deliveryFee || 0)
          : 0;

      const totalItems = state.cart.reduce((acc, item) => acc + item.quantity, 0);

      return { subtotal, deliveryFee, total: subtotal + deliveryFee, totalItems };
    }

    window.updateCheckoutField = (field, value) => {
      state.checkout[field] = value;
      if (field === 'deliveryType' || field === 'paymentMethod') {
        window.render();
      }
    };

    window.proceedToCheckout = () => {
      const { subtotal } = getCartTotals();
      if (subtotal < Number(state.settings.minOrder || 0)) {
        window.showToast(`Pedido mínimo é ${formatBRL(state.settings.minOrder)}`, 'error');
        return;
      }
      state.cartStep = 'checkout';
      window.render();
    };

    function generateWhatsAppMessage(order) {
      const lines = [];
      lines.push(`*NOVO PEDIDO - ${state.settings.storeName.toUpperCase()}*`);
      lines.push(`Pedido: #${order.id}`);
      lines.push(`Data/Hora: ${formatDateTime(order.createdAt)}`);
      lines.push(`--------------------------------`);
      lines.push(`*Cliente:* ${order.customerName}`);
      lines.push(`*Telefone:* ${order.customerPhone}`);
      lines.push(`--------------------------------`);
      lines.push(`*ITENS DO PEDIDO:*`);

      order.items.forEach(item => {
        const addonsSum = item.addons.reduce((s, a) => s + a.price, 0);
        const itemTotal = (item.unitPrice + addonsSum) * item.quantity;
        lines.push(`\n*${item.quantity}x ${item.name}* — ${formatBRL(itemTotal)}`);
        if (item.addons && item.addons.length > 0) {
          item.addons.forEach(a => lines.push(`  + ${a.name} (${formatBRL(a.price)})`));
        }
        if (item.notes) lines.push(`  _Obs: ${item.notes}_`);
      });

      lines.push(`\n--------------------------------`);
      if (order.deliveryType === 'delivery') {
        lines.push(`*ENTREGA (DELIVERY)*`);
        lines.push(`Endereço: ${order.address.street}, Nº ${order.address.number}`);
        lines.push(`Bairro: ${order.address.neighborhood}`);
        if (order.address.complement) lines.push(`Complemento: ${order.address.complement}`);
      } else {
        lines.push(`*RETIRADA NA LOJA*`);
      }

      lines.push(`--------------------------------`);
      const paymentLabels = {
        pix: 'Pix (Comprovante em anexo)',
        card: 'Cartão na Entrega',
        cash: 'Dinheiro'
      };
      lines.push(`*Pagamento:* ${paymentLabels[order.paymentMethod] || order.paymentMethod}`);
      if (order.paymentMethod === 'cash' && order.changeFor) {
        lines.push(`*Troco para:* R$ ${order.changeFor}`);
      }

      lines.push(`--------------------------------`);
      lines.push(`Subtotal: ${formatBRL(order.subtotal)}`);
      if (order.deliveryType === 'delivery') {
        lines.push(`Taxa de Entrega: ${formatBRL(order.deliveryFee)}`);
      }
      lines.push(`*TOTAL: ${formatBRL(order.total)}*`);

      return lines.join('\n');
    }

    async function processFinalOrder() {
      const c = state.checkout;
      const totals = getCartTotals();
      const orderNum = 'DS-' + Math.floor(1043 + Math.random() * 8900);

      const newOrder = {
        id: orderNum,
        createdAt: new Date().toISOString(),
        status: 'new',
        customerName: c.customerName.trim(),
        customerPhone: c.customerPhone.trim(),
        deliveryType: c.deliveryType,
        address: c.deliveryType === 'delivery' ? {
          street: c.street.trim(),
          number: c.number.trim(),
          neighborhood: c.neighborhood.trim(),
          complement: c.complement.trim(),
          reference: c.reference.trim()
        } : null,
        paymentMethod: c.paymentMethod,
        changeFor: c.paymentMethod === 'cash' ? c.changeFor.trim() : '',
        items: state.cart.map(item => ({
          productId: item.productId,
          name: item.name,
          quantity: item.quantity,
          unitPrice: item.unitPrice,
          addons: item.addons,
          notes: item.notes
        })),
        subtotal: totals.subtotal,
        deliveryFee: totals.deliveryFee,
        total: totals.total
      };

      await createOrderInCloud(newOrder);

      const messageText = generateWhatsAppMessage(newOrder);
      const cleanPhone = (state.settings.whatsappNumber || '').replace(/\D/g, '');
      const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(messageText)}`;

      state.cart = [];
      state.isCartOpen = false;

      window.showToast(`Pedido #${newOrder.id} registrado com sucesso!`, 'success');
      window.open(whatsappUrl, '_blank');
      window.render();
    }

    window.submitOrder = (e) => {
      e.preventDefault();
      const c = state.checkout;
      if (state.cart.length === 0) {
        window.showToast('Sua sacola está vazia.', 'error');
        return;
      }
      if (!c.customerName.trim() || !c.customerPhone.trim()) {
        window.showToast('Preencha seu nome e telefone.', 'error');
        return;
      }
      if (c.deliveryType === 'delivery' && (!c.street.trim() || !c.number.trim() || !c.neighborhood.trim())) {
        window.showToast('Preencha os dados de entrega.', 'error');
        return;
      }

      if (c.paymentMethod === 'pix') {
        state.isCartOpen = false;
        state.pixPaymentModal = {
          timeLeft: 300,
          expired: false,
          orderData: c
        };
        startPixTimer();
        window.render();
        return;
      }

      processFinalOrder();
    };

    function startPixTimer() {
      if (pixTimerInterval) clearInterval(pixTimerInterval);
      pixTimerInterval = setInterval(() => {
        if (!state.pixPaymentModal) {
          clearInterval(pixTimerInterval);
          return;
        }
        state.pixPaymentModal.timeLeft--;
        if (state.pixPaymentModal.timeLeft <= 0) {
          clearInterval(pixTimerInterval);
          state.pixPaymentModal.timeLeft = 0;
          state.pixPaymentModal.expired = true;
          window.render();
        } else {
          const timerEl = document.getElementById('pix-countdown-timer');
          if (timerEl) {
            const m = Math.floor(state.pixPaymentModal.timeLeft / 60);
            const s = state.pixPaymentModal.timeLeft % 60;
            timerEl.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          }
        }
      }, 1000);
    }

    window.confirmPixPayment = () => {
      if (pixTimerInterval) clearInterval(pixTimerInterval);
      state.pixPaymentModal = null;
      processFinalOrder();
    };

    window.cancelPixPayment = () => {
      if (pixTimerInterval) clearInterval(pixTimerInterval);
      state.pixPaymentModal = null;
      window.render();
    };

            ${item.addons.map(a => `<div style="padding-left:10px; font-size:10px;">+ ${a.name}</div>`).join('')}
            ${item.notes ? `<div style="padding-left:10px; font-size:10px;">OBS: ${item.notes}</div>` : ''}

      receiptEl.innerHTML = `
        <div style="text-align:center; border-bottom: 1px dashed #000; padding-bottom: 8px; margin-bottom: 8px;">
          <div style="font-size:15px; font-weight:700;">${state.settings.storeName.toUpperCase()}</div>

        <div style="margin-bottom: 8px;">

          ${itemsHtml}
        </div>
        <div>
          <div style="display:flex; justify-content:space-between;"><span>Subtotal:</span><span>${formatBRL(order.subtotal)}</span></div>
          ${order.deliveryFee > 0 ? `<div style="display:flex; justify-content:space-between;"><span>Taxa Entrega:</span><span>${formatBRL(order.deliveryFee)}</span></div>` : ''}
          <div style="display:flex; justify-content:space-between; font-weight:700; font-size:13px; margin-top:4px;"><span>TOTAL:</span><span>${formatBRL(order.total)}</span></div>
        </div>

      wrapperEl.classList.add('flex');

                  <div>
                    <label class="block font-semibold mb-1 text-brand-ink text-xs">Forma de Pagamento</label>
                    <select onchange="updateCheckoutField('paymentMethod', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-brand-border bg-white text-xs">
                      <option value="pix" ${c.paymentMethod === 'pix' ? 'selected' : ''}>Pix (Comprovante instantâneo)</option>
                      <option value="card" ${c.paymentMethod === 'card' ? 'selected' : ''}>Cartão na Entrega</option>
                      <option value="cash" ${c.paymentMethod === 'cash' ? 'selected' : ''}>Dinheiro</option>
                    </select>
                  </div>

                  ${c.paymentMethod === 'cash' ? `
                    <div>
                      <label class="block text-xs font-semibold mb-1 text-brand-ink">Troco para quanto?</label>
                      <input type="text" value="${c.changeFor}" oninput="updateCheckoutField('changeFor', this.value)" class="w-full px-3.5 py-2 rounded-xl border border-brand-border text-xs" placeholder="Ex: 50,00" />
                    </div>
                  ` : ''}
                </form>
              `}
            </div>

            ${state.cart.length > 0 ? `
              <div class="p-5 border-t border-brand-border bg-white space-y-3">
                <div class="space-y-1 text-xs">
                  <div class="flex justify-between text-brand-muted"><span>Subtotal</span><span>${formatBRL(totals.subtotal)}</span></div>
                  ${state.cartStep === 'checkout' && totals.deliveryFee > 0 ? `<div class="flex justify-between text-brand-muted"><span>Taxa de Entrega</span><span>${formatBRL(totals.deliveryFee)}</span></div>` : ''}
                  <div class="flex justify-between text-base font-bold pt-1 border-t border-brand-border text-brand-ink"><span>Total</span><span>${formatBRL(state.cartStep === 'items' ? totals.subtotal : totals.total)}</span></div>
                </div>

                ${state.cartStep === 'items' ? `
                  <button type="button" onclick="proceedToCheckout()" class="w-full py-3 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-bold text-sm shadow transition cursor-pointer">
                    Avançar para Entrega
                  </button>
                ` : `
                  <button type="submit" form="checkout-form" class="w-full py-3 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-bold text-sm shadow transition cursor-pointer">
                    ${c.paymentMethod === 'pix' ? 'Gerar Pagamento Pix' : 'Enviar Pedido no WhatsApp'}
                  </button>
                `}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderProductModal() {
      const modal = state.selectedProductModal;
      if (!modal) return '';
      const p = modal.product;
      const addonsTotal = (p.addons || []).filter(a => modal.selectedAddons.includes(a.id)).reduce((sum, a) => sum + a.price, 0);
      const unitTotal = (p.price + addonsTotal) * modal.quantity;

      return `
        <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onclick="if(event.target === this) closeProductModal();">
          <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="relative h-60 bg-brand-soft">
              <img src="${p.image || ''}" alt="${p.name}" class="w-full h-full object-cover" />
              <button type="button" onclick="closeProductModal()" class="absolute top-4 right-4 bg-white/80 hover:bg-white p-2 rounded-full shadow cursor-pointer">
                <i data-lucide="x" class="w-5 h-5 text-brand-ink"></i>
              </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
              <div>
                <h3 class="text-xl font-bold text-brand-ink">${p.name}</h3>
                <p class="text-sm text-brand-muted mt-1">${p.description || ''}</p>
                <p class="text-lg font-bold text-brand-primary mt-2">${formatBRL(p.price)}</p>
              </div>

              ${p.addons && p.addons.length > 0 ? `
                <div class="space-y-2 pt-3 border-t border-brand-border">
                  <h4 class="font-bold text-sm text-brand-ink">Adicionais Opcionais</h4>
                  ${p.addons.map(a => `
                    <label class="flex items-center justify-between p-3 rounded-xl bg-brand-cream border border-brand-border cursor-pointer">
                      <div class="flex items-center gap-2">
                        <input type="checkbox" ${modal.selectedAddons.includes(a.id) ? 'checked' : ''} onchange="toggleModalAddon('${a.id}')" class="rounded text-brand-primary focus:ring-brand-primary" />
                        <span class="text-xs font-semibold text-brand-ink">${a.name}</span>
                      </div>
                      <span class="text-xs font-bold text-brand-primary">+ ${formatBRL(a.price)}</span>
                    </label>
                  `).join('')}
                </div>
              ` : ''}

              <div>
                <label class="block text-xs font-semibold text-brand-ink mb-1">Observações do item</label>
                <textarea rows="2" oninput="updateModalNotes(this.value)" class="w-full p-3 rounded-xl border border-brand-border text-xs bg-brand-cream/50" placeholder="Ex: Sem cobertura, caprichar no recheio...">${modal.notes}</textarea>
              </div>
            </div>

            <div class="p-4 bg-brand-cream border-t border-brand-border flex items-center justify-between gap-4">
              <div class="flex items-center gap-2 bg-white rounded-xl p-1 border border-brand-border">
                <button type="button" onclick="updateModalQuantity(-1)" class="w-8 h-8 rounded-lg bg-brand-soft font-bold text-sm flex items-center justify-center cursor-pointer">-</button>
                <span class="w-6 text-center font-bold text-sm">${modal.quantity}</span>
                <button type="button" onclick="updateModalQuantity(1)" class="w-8 h-8 rounded-lg bg-brand-soft font-bold text-sm flex items-center justify-center cursor-pointer">+</button>
              </div>
              <button type="button" onclick="addModalProductToCart()" class="flex-1 py-3.5 px-6 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-bold text-sm shadow transition flex items-center justify-center gap-2 cursor-pointer">
                <span>Adicionar • ${formatBRL(unitTotal)}</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPixModal() {
      const pm = state.pixPaymentModal;
      if (!pm) return '';
      const m = Math.floor(pm.timeLeft / 60);
      const s = pm.timeLeft % 60;

      return `
        <div class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl text-center space-y-5 border border-brand-border">
            ${pm.expired ? `
              <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
                <i data-lucide="clock-alert" class="w-8 h-8"></i>
              </div>
              <h3 class="text-2xl font-bold text-rose-600">Tempo Esgotado</h3>
              <p class="text-xs text-brand-muted">O prazo de 5 minutos para o pagamento Pix expirou.</p>
              <button type="button" onclick="cancelPixPayment()" class="w-full py-3 rounded-xl bg-brand-primary text-white font-bold text-sm cursor-pointer">Voltar</button>
            ` : `
              <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-brand-soft text-brand-primary font-bold text-xs">
                <i data-lucide="timer" class="w-4 h-4"></i>
                <span>Expira em <span id="pix-countdown-timer">${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}</span></span>
              </div>
              <div>
                <h3 class="text-xl font-bold text-brand-ink">Pagamento via Pix</h3>
                <p class="text-2xl font-bold text-emerald-700 mt-1">${formatBRL(getCartTotals().total)}</p>
              </div>
              <div class="bg-brand-cream p-4 rounded-2xl border border-brand-border text-left space-y-2 text-xs">
                <div><span class="text-brand-muted">Favorecido:</span> <strong>${state.settings.pixName}</strong></div>
                <div><span class="text-brand-muted">Chave Pix:</span> <code class="bg-white p-1 rounded font-mono">${state.settings.pixKey}</code></div>
              </div>
              <div class="space-y-2">
                <button type="button" onclick="confirmPixPayment()" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow cursor-pointer">
                  Já fiz o Pix • Enviar Pedido
                </button>
                <button type="button" onclick="cancelPixPayment()" class="w-full py-2.5 rounded-xl text-xs font-semibold text-brand-muted hover:bg-neutral-100 cursor-pointer">Cancelar</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // --- PAINEL DO LOJISTA (ADMIN) ---
    function renderAdminPanel() {
      if (!state.adminAuthenticated) return '';
      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-brand-border">
            <div class="flex flex-wrap gap-2">
              ${[
                { id: 'orders', label: 'Pedidos', icon: 'clipboard-list' },
                { id: 'products', label: 'Produtos', icon: 'cake' },
                { id: 'categories', label: 'Categorias', icon: 'tags' },
                { id: 'settings', label: 'Configurações', icon: 'settings' }
              ].map(t => `
                <button type="button" onclick="switchAdminTab('${t.id}')"
                  class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition cursor-pointer ${state.adminTab === t.id ? 'bg-brand-primary text-white' : 'bg-brand-soft text-brand-ink hover:bg-brand-border'}">
                  <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                  <span>${t.label}</span>
                </button>
              `).join('')}
            </div>
            <span class="text-xs font-semibold px-3 py-1 rounded-full ${state.dbConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
              ${state.dbConnected ? 'Nuvem Conectada' : 'Conectando...'}
            </span>
          </div>

          ${state.adminTab === 'orders' ? renderAdminOrders() : ''}
          ${state.adminTab === 'products' ? renderAdminProducts() : ''}
          ${state.adminTab === 'categories' ? renderAdminCategories() : ''}
          ${state.adminTab === 'settings' ? renderAdminSettings() : ''}
        </div>
      `;
    }

    function renderAdminOrders() {
      const cols = [
        { key: 'new', title: 'Novos', badge: 'bg-amber-100 text-amber-900', next: 'preparing', nextLabel: 'Preparar' },
        { key: 'preparing', title: 'Em Preparo', badge: 'bg-blue-100 text-blue-900', next: 'ready', nextLabel: 'Pronto' },
        { key: 'ready', title: 'Pronto / Saiu', badge: 'bg-purple-100 text-purple-900', next: 'completed', nextLabel: 'Concluir' },
        { key: 'completed', title: 'Concluídos', badge: 'bg-emerald-100 text-emerald-900', next: null, nextLabel: '' }
      ];

      return `
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${cols.map(col => {
            const list = state.orders.filter(o => o.status === col.key);
            return `
              <div class="bg-brand-soft/60 p-3.5 rounded-2xl border border-brand-border flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-sm text-brand-ink">${col.title}</h3>
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${col.badge}">${list.length}</span>
                </div>
                <div class="space-y-3">
                  ${list.length === 0 ? `<p class="text-xs text-brand-muted text-center py-6">Nenhum pedido</p>` : list.map(o => `
                    <div class="bg-white p-3.5 rounded-xl border border-brand-border shadow-sm space-y-2 text-xs">
                      <div class="flex justify-between items-start font-bold">
                        <div>
                          <span class="text-brand-primary">#${o.id}</span>
                          <h4 class="text-brand-ink text-sm">${o.customerName}</h4>
                        </div>
                        <span class="text-emerald-700">${formatBRL(o.total)}</span>
                      </div>
                      <div class="text-brand-muted bg-brand-cream/50 p-2 rounded-lg">
                        ${o.items.map(i => `<div>${i.quantity}x ${i.name}</div>`).join('')}
                      </div>
                      <div><strong>Entrega:</strong> ${o.deliveryType === 'delivery' ? `${o.address.street}, ${o.address.number} - ${o.address.neighborhood}` : 'Retirada na Loja'}</div>
                      <div class="flex items-center gap-1.5 pt-2 border-t border-brand-border">
                        <button type="button" onclick="openThermalPrintModal('${o.id}')" class="px-2 py-1.5 rounded-lg bg-neutral-100 hover:bg-neutral-200 text-xs font-semibold flex items-center gap-1 cursor-pointer">
                          <i data-lucide="printer" class="w-3.5 h-3.5"></i> Comanda
                        </button>
                        ${col.next ? `
                          <button type="button" onclick="updateOrderStatusInCloud('${o.id}', '${col.next}')" class="px-2.5 py-1.5 rounded-lg bg-brand-primary text-white font-semibold flex-1 text-center cursor-pointer">
                            ${col.nextLabel}
                          </button>
                        ` : ''}
                        <button type="button" onclick="if(confirm('Excluir pedido?')) deleteOrderFromCloud('${o.id}')" class="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50 cursor-pointer">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderAdminProducts() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="bg-white p-5 rounded-2xl border border-brand-border space-y-4 h-fit">
            <h3 class="font-bold text-base text-brand-ink">Novo Produto</h3>
            <form onsubmit="
              event.preventDefault();
              saveProductToCloud({
                id: 'prod-' + Date.now(),
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value),
                categoryId: document.getElementById('p-cat').value,
                image: document.getElementById('p-img').value,
                description: document.getElementById('p-desc').value,
                active: true,
                addons: []
              });
              event.target.reset();
            " class="space-y-3 text-xs">
              <div>
                <label class="block font-semibold mb-1 text-brand-ink">Nome *</label>
                <input id="p-name" required class="w-full p-2.5 rounded-xl border border-brand-border" />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block font-semibold mb-1 text-brand-ink">Preço (R$) *</label>
                  <input id="p-price" type="number" step="0.01" required class="w-full p-2.5 rounded-xl border border-brand-border" />
                </div>
                <div>
                  <label class="block font-semibold mb-1 text-brand-ink">Categoria</label>
                  <select id="p-cat" class="w-full p-2.5 rounded-xl border border-brand-border bg-white">
                    ${state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block font-semibold mb-1 text-brand-ink">URL da Imagem</label>
                <input id="p-img" placeholder="https://..." class="w-full p-2.5 rounded-xl border border-brand-border" />
              </div>
              <div>
                <label class="block font-semibold mb-1 text-brand-ink">Descrição</label>
                <textarea id="p-desc" rows="2" class="w-full p-2.5 rounded-xl border border-brand-border"></textarea>
              </div>
              <button type="submit" class="w-full py-3 rounded-xl bg-brand-primary text-white font-bold cursor-pointer">Cadastrar Produto</button>
            </form>
          </div>

          <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${state.products.map(p => `
              <div class="bg-white p-4 rounded-2xl border border-brand-border flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <img src="${p.image || ''}" class="w-12 h-12 rounded-xl object-cover" />
                  <div>
                    <h4 class="font-bold text-xs text-brand-ink">${p.name}</h4>
                    <p class="text-xs text-brand-primary font-semibold">${formatBRL(p.price)}</p>
                  </div>
                </div>
                <button type="button" onclick="deleteProductFromCloud('${p.id}')" class="p-2 rounded-lg text-rose-600 hover:bg-rose-50 cursor-pointer">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAdminCategories() {
      return `
        <div class="max-w-md bg-white p-6 rounded-2xl border border-brand-border space-y-4">
          <h3 class="font-bold text-base text-brand-ink">Categorias</h3>
          <form onsubmit="
            event.preventDefault();
            const inp = document.getElementById('new-cat');
            if(!inp.value.trim()) return;
            saveCategoriesToCloud([...state.categories, { id: 'cat-' + Date.now(), name: inp.value.trim() }]);
            inp.value = '';
          " class="flex gap-2">
            <input id="new-cat" placeholder="Nova categoria" class="flex-1 p-2.5 rounded-xl border border-brand-border text-xs" />
            <button type="submit" class="px-4 py-2.5 rounded-xl bg-brand-primary text-white text-xs font-bold cursor-pointer">Adicionar</button>
          </form>
          <div class="space-y-2">
            ${state.categories.map(c => `
              <div class="flex justify-between items-center p-3 rounded-xl bg-brand-cream text-xs">
                <span class="font-semibold text-brand-ink">${c.name}</span>
                <button type="button" onclick="saveCategoriesToCloud(state.categories.filter(x => x.id !== '${c.id}'))" class="text-rose-600 font-semibold cursor-pointer">Remover</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAdminSettings() {
      const s = state.settings;
      return `
        <form onsubmit="
          event.preventDefault();
          saveSettingsToCloud({
            storeName: document.getElementById('s-name').value,
            whatsappNumber: document.getElementById('s-whats').value,
            deliveryFee: parseFloat(document.getElementById('s-fee').value || 0),
            minOrder: parseFloat(document.getElementById('s-min').value || 0),
            pixKey: document.getElementById('s-pix').value,
            pixName: document.getElementById('s-pixname').value,
            adminPin: document.getElementById('s-pin').value
          });
        " class="bg-white p-6 rounded-3xl border border-brand-border space-y-4 text-xs max-w-xl">
          <h3 class="font-bold text-base text-brand-ink">Configurações da Loja</h3>
          <div>
            <label class="block font-semibold mb-1 text-brand-ink">Nome da Confeitaria</label>
            <input id="s-name" value="${s.storeName}" class="w-full p-2.5 rounded-xl border border-brand-border" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold mb-1 text-brand-ink">WhatsApp (com 55 e DDD)</label>
              <input id="s-whats" value="${s.whatsappNumber}" class="w-full p-2.5 rounded-xl border border-brand-border" />
            </div>
            <div>
              <label class="block font-semibold mb-1 text-brand-ink">PIN Admin</label>
              <input id="s-pin" value="${s.adminPin}" class="w-full p-2.5 rounded-xl border border-brand-border" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold mb-1 text-brand-ink">Taxa de Entrega (R$)</label>
              <input id="s-fee" type="number" step="0.01" value="${s.deliveryFee}" class="w-full p-2.5 rounded-xl border border-brand-border" />
            </div>
            <div>
              <label class="block font-semibold mb-1 text-brand-ink">Pedido Mínimo (R$)</label>
              <input id="s-min" type="number" step="0.01" value="${s.minOrder}" class="w-full p-2.5 rounded-xl border border-brand-border" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold mb-1 text-brand-ink">Chave Pix</label>
              <input id="s-pix" value="${s.pixKey}" class="w-full p-2.5 rounded-xl border border-brand-border" />
            </div>
            <div>
              <label class="block font-semibold mb-1 text-brand-ink">Nome no Pix</label>
              <input id="s-pixname" value="${s.pixName}" class="w-full p-2.5 rounded-xl border border-brand-border" />
            </div>
          </div>
          <button type="submit" class="px-6 py-3 rounded-xl bg-brand-primary text-white font-bold cursor-pointer">Salvar Configurações</button>
        </form>
      `;
    }

    function renderFooter() {
      return `
        <footer class="border-t border-brand-border py-6 text-center text-xs text-brand-muted mt-12">
          <p>© ${new Date().getFullYear()} ${state.settings.storeName} • Todos os direitos reservados</p>
        </footer>
      `;
    }

    // Inicialização
    window.render();
    initCloudSync();
  </script>
</body>
</html>
